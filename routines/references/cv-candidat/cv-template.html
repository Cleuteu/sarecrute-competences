<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Dossier de présentation candidat — SaRecrute</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script>
/* ==========================================================================
   BLOC DE DONNEES — la seule zone a editer d'un candidat a l'autre.
   Aucune regle CSS ne doit etre touchee.

   REGLE ABSOLUE : chaque valeur ci-dessous est la recopie d'un champ Airtable,
   verifie par les recruteuses. Le PDF joint a la fiche (champ CV) n'est JAMAIS
   une source. Le champ "Profil IA" (fldtz8Gy68I1RMXrm) n'est JAMAIS une source.
   Un champ Airtable vide reste vide : sa ligne disparait du document.
   ========================================================================== */
/*DATA-START*/
const ANONYME = false;

const CANDIDAT = {
  reference:   "SR-AAAA-XX",

  // --- Identite -----------------------------------------------------------
  prenom:      "Prénom",                    // fld1WR6pNpe8sAya6
  nom:         "NOM",                       // fld6yzzWrqBZBtXly
  sousTitre:   "Vétérinaire · Pratique · N ans d'expérience",
                                            // fldizV1UoejwizYSq + fldKxF494zI5Kgc6n + fldSGOptEz0Api4wN

  // 4 lignes maximum. Redigees a partir des seuls champs de la section
  // "Notes et entretiens" : Profil (fldlnO9d1ctGABT9v), Notes (fld0s84U1HdrHKqkg),
  // Notes du candidat (fld8WaHsnucNvdEqW), Transcripts (fldNMVoFoHx3t3O9D).
  // Jamais depuis "Profil IA", jamais depuis le CV PDF.
  // Aucun echange interne consultant-client, aucune information perimee.
  accroche:    "Quatre lignes factuelles issues des notes d'entretien : parcours, niveau d'autonomie, ce que le candidat cherche. Pas de superlatif, pas d'adjectif non sourcé.",

  // --- Contact (fldmtHKu93RMqkVw6 / fldZ9229oPu876Ls2) ---------------------
  // Pas de localisation : ni ville, ni departement, ni CP.
  contact: {
    email:     "",
    telephone: ""
  },

  // --- Cadre recherche — toute valeur vide masque sa ligne -----------------
  // "statut" (Statut Recherche) et "enPoste" (En poste ?) ont ete retires du
  // dossier le 07/09/2026 : ne pas les remettre, meme si la fiche les renseigne.
  cadre: {
    experience:    "",   // fldSGOptEz0Api4wN Années d'expérience
    disponibilite: "",   // fldlCCJY7quJEqbyv Date de disponibilité
    contrat:       "",   // fldZaUsTcNsN7HlWe Statuts contractuels souhaités
    tempsTravail:  "",   // fldGZhonpYwDW78ze Type de temps de travail
    gardes:        "",   // fldI1xWGed3dcQIUs + fldZ3kGzgXLhj5UJv
    remuneration:  "",   // fldZZj7aCQpzQKgZx Rémunération souhaitée
    mobilite:      ""    // NE PAS RENSEIGNER (decision du 27/08/2026) : la ligne
                         // reste vide et disparait du dossier. La zone de
                         // recherche se discute de vive voix, pas sur le document.
  },

  // --- Domaines -----------------------------------------------------------
  pratiques:    [],      // fldsUtHmyFAFyjFgl Pratiques maitrisées
  specialites:  [],      // flde9dmHJUqdMZIOL Spécialités maitrisées
  recherche:    [],      // fldKxF494zI5Kgc6n Pratiques requises + fldYpaOYuUBHpqlqU Spécialités requises

  // --- Formation et diplomes ----------------------------------------------
  // Une valeur exactement egale a "Oui" sort en pastille verte portant son
  // intitule ; une valeur detaillee garde un bloc intitule + texte.
  // Internat et DESV ne se renseignent que positifs : jamais "Non".
  formation: {
    ecole:        "",    // fldEUkJLo4ygiEZHZ Ecole véto
    anneeSortie:  "",    // fldp6whT8yfZdETi4 Année de sortie
    internat:     "",    // fld3eO9JuwrHyNkIJ Internat
    desv:         "",    // fldnvfN95E23ng7ep DESV?
    diplomeSup:   "",    // fldmi2DQKpPmcpXEV Diplôme supplémentaire
    habilitation: ""     // fldSIVZ8UxggjhffA Habilitation sanitaire
  },

  // --- Langues (fld48WU9SCR9DkVN6) — noms seuls, aucun niveau -------------
  langues: [],

  // --- Parcours (table Expériences, tblTYdApkiHqKeBVi) --------------------
  // Un objet par poste, du plus recent au plus ancien :
  //   poste       = fldKL9vuSGhrwgV4c (Poste)
  //   structure   = fldZsxMqiU6OuTCBH (Structure)
  //   periode     = fldblqIgDkZX08ScY (Période)   duree = flduZveIw1rViotNt (Durée)
  //   description = fldf4RmAB4BbabJgI (Description), SANS la mention de source
  //                 entre parentheses en fin de champ (« (CV) », « (complément
  //                 TemaVet du …) ») : c'est de la tracabilite interne.
  // Ne retiens que les postes en clinique (Salarié, Remplacement). Les stages
  // d'etudiant et les jobs hors clinique allongent la page sans repondre a la
  // question que se pose le lecteur. Bloc vide = section absente.
  experiences: [],

  // --- Bilan de competences ----------------------------------------------
  // Table Compétences (tblH8Zym1DNu7PN3c), un enregistrement par acte :
  //   acte    = fldUZQyIvlhNeZhzG (Acte)      espece = fldlREgGF38TczqNi (Espèce)
  //   famille = fldroKCZqI4OLndpo (Famille), lookup de la famille de l'acte
  //   niveau  = fld0SGFcuffxHSSq0 (Niveau), valeur Airtable recopiee telle quelle :
  //   "Autonome" | "Ponctuel" | "En apprentissage" | "Jamais fait" | "Non concerné"
  // Le regroupement (espece puis famille) et le tri par niveau sont automatiques :
  // ne les pre-calcule pas, recopie le plat { espece, famille, acte, niveau }.
  competences: []
};
/*DATA-END*/

/* Traduction des niveaux Airtable vers les trois etats lisibles d'un coup d'oeil,
   plus le nombre de crans allumes de la jauge. "Non concerné" n'est pas affiche.
   La jauge a trois crans porte les QUATRE niveaux Airtable sans en fondre deux :
   « Ponctuel » (2 crans) et « En apprentissage » (1 cran) restent distincts, la
   ou les pastilles les affichaient tous deux en « en cours ». Rien n'est invente
   pour autant — chaque cran est la recopie d'un Niveau saisi par une recruteuse.
   Les decomptes, eux, restent sur les trois etats : c'est ce que la clinique
   compte.
   La teinte des crans suit la meme progression que le nombre de crans, pour que
   la jauge se lise autant a la couleur qu'au remplissage : vert (tenu seul),
   orange (ponctuel), or (en apprentissage), gris (jamais fait). */
const NIVEAUX = {
  "Autonome":         { etat:"ok",  rang:0, crans:3, teinte:"t3" },
  "Ponctuel":         { etat:"wip", rang:1, crans:2, teinte:"t2" },
  "En apprentissage": { etat:"wip", rang:2, crans:1, teinte:"t1" },
  "Jamais fait":      { etat:"no",  rang:3, crans:0, teinte:"t0" },
  "Non évalué":       { etat:"na",  rang:4, crans:0, teinte:"na" },  // referentiel seul, aucune cotation
  "Non concerné":     { etat:null,  rang:9, crans:0, teinte:null }
};
const ETATS = [
  { cle:"ok",  libelle:"Acquis" },
  { cle:"wip", libelle:"En cours" },
  { cle:"no",  libelle:"Non acquis" },
  { cle:"na",  libelle:"Non évalué" }
];
</script>
<style>
  :root{
    --sr-cream:#F8F4EA; --sr-paper:#FFFDF8; --sr-forest:#203832; --sr-green:#426354;
    --sr-sage:#6E9278;  --sr-muted:#64736E; --sr-terracotta:#C87355; --sr-gold:#DCA85E;
    --sr-orange:#CE8734;   /* cran « ponctuel » : entre l'or et le terracotta */
    --sr-line:rgba(32,56,50,.11); --sr-line-2:rgba(32,56,50,.18);
    --sr-wash:rgba(110,146,120,.09);
    --scale:1;
  }
  @page{ size:A4; margin:0; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:#E7E1D4; }
  body{
    font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:var(--sr-forest); -webkit-font-smoothing:antialiased;
    display:flex; justify-content:center; padding:18px 0;
  }

  .page{
    width:210mm; height:297mm; background:var(--sr-cream);
    position:relative; overflow:hidden;
    display:flex; flex-direction:column;
    box-shadow:0 10px 34px rgba(32,56,50,.16);
  }

  /* ---------- Bandeau ---------- */
  .band{
    height:32mm; flex:0 0 32mm; background:var(--sr-green);
    display:flex; align-items:center; justify-content:space-between;
    padding:0 14mm; color:var(--sr-cream);
  }
  .brand{ display:flex; align-items:center; gap:9px; }
  .brand svg{ width:46px; height:31px; display:block; }
  .wordmark{
    font-family:Fraunces,Georgia,serif; font-weight:600; font-size:20.5px;
    letter-spacing:-.03em; color:var(--sr-cream); line-height:1;
  }
  .wordmark .r{ color:var(--sr-terracotta); }
  .band-label{
    font-size:9.5px; letter-spacing:.10em; text-transform:uppercase;
    font-weight:600; color:rgba(248,244,234,.82); text-align:right; line-height:1.5;
  }
  .band-label .ref{ display:block; color:rgba(248,244,234,.55); letter-spacing:.06em; }

  /* ---------- Corps ---------- */
  .body{
    flex:1 1 auto; min-height:0; padding:calc(7mm * var(--scale)) 14mm 0;
    display:flex; flex-direction:column;
  }

  .identity{ padding-bottom:calc(4.4mm * var(--scale)); border-bottom:1px solid var(--sr-line); }
  .name{
    font-family:Fraunces,Georgia,serif; font-weight:600;
    font-size:calc(31px * var(--scale)); letter-spacing:-.02em;
    line-height:1.06; color:var(--sr-forest);
  }
  .subtitle{
    font-weight:500; font-size:calc(11.6px * var(--scale)); color:var(--sr-terracotta);
    margin-top:calc(2.2mm * var(--scale)); letter-spacing:.005em;
  }
  /* Fer a gauche, pas justifie : sur quatre lignes, la justification ouvre
     des rivieres de blanc qui coutent plus en lecture qu'un bord droit irregulier. */
  .accroche{
    margin-top:calc(3.2mm * var(--scale));
    font-size:calc(10.2px * var(--scale)); line-height:1.55; color:#2F433D;
    max-width:172mm; text-align:left;
  }

  .cols{
    flex:1 1 auto; min-height:0; display:flex; gap:calc(7mm * var(--scale));
    padding-top:calc(4.6mm * var(--scale));
  }
  /* 54mm et non 62 : la colonne laterale ne remplit jamais sa hauteur, alors
     que la colonne principale, elle, paie chaque retour a la ligne. Les
     millimetres rendus au bilan financent la lisibilite des competences. */
  .aside{ flex:0 0 54mm; width:54mm; }
  .main{ flex:1 1 auto; min-width:0; }

  .label{
    font-size:calc(9.8px * var(--scale)); text-transform:uppercase; font-weight:600;
    letter-spacing:.09em; color:var(--sr-muted);
    margin-bottom:calc(2.4mm * var(--scale));
  }
  .main .label{ letter-spacing:.10em; }
  .block + .block{ margin-top:calc(3.4mm * var(--scale)); }

  /* --- carte laterale --- */
  .card{
    background:var(--sr-paper); border:1px solid var(--sr-line);
    border-radius:14px; padding:calc(3.1mm * var(--scale)) calc(3.8mm * var(--scale));
  }
  .card.soft{ background:var(--sr-wash); border-color:rgba(110,146,120,.20); }
  /* Intitule et valeur sur la meme ligne (intitule a gauche, 19,5 mm) : la
     carte du cadre passe de douze lignes a huit, et c'est elle qui bride la
     page. Les millimetres rendus financent un corps de texte plus grand
     partout. */
  .kv{
    display:grid; grid-template-columns:calc(19.5mm * var(--scale)) 1fr;
    column-gap:calc(1.8mm * var(--scale)); align-items:baseline;
  }
  /* Un intitule long ou une valeur longue (plus de 13 / 18 caracteres, decide
     au rendu) reprend la forme empilee : intitule au-dessus, valeur pleine
     largeur, plutot qu'une valeur hachee sur quatre lignes dans 24 mm. */
  .kv.long{ grid-template-columns:1fr; row-gap:calc(.2mm * var(--scale)); }
  .kv + .kv{ margin-top:calc(1.25mm * var(--scale)); }
  .kv dt{
    font-size:calc(7.6px * var(--scale)); text-transform:uppercase; font-weight:600;
    letter-spacing:.05em; color:var(--sr-muted); line-height:1.4; white-space:nowrap;
  }
  .kv dd{ font-size:calc(9.6px * var(--scale)); line-height:1.4; color:var(--sr-forest); }
  /* Contact : une ligne par coordonnee, sans intitule — un e-mail et un
     numero de telephone se reconnaissent seuls. Corps un peu plus petit et
     marges reduites : une adresse de 30 caracteres doit tenir sur sa ligne. */
  .card.contact{ padding-left:calc(3mm * var(--scale)); padding-right:calc(3mm * var(--scale)); }
  .ct{
    font-size:calc(9.2px * var(--scale)); line-height:1.45; letter-spacing:-.01em;
    color:var(--sr-forest); overflow-wrap:anywhere;
  }
  .ct + .ct{ margin-top:calc(.9mm * var(--scale)); }

  .pills{ display:flex; flex-wrap:wrap; gap:calc(1.5mm * var(--scale)); }
  .pills + .sublabel{ margin-top:calc(2mm * var(--scale)); }
  .pills.apres{ margin-top:calc(1.8mm * var(--scale)); }
  .sublabel{
    font-size:calc(8.2px * var(--scale)); text-transform:uppercase; font-weight:600;
    letter-spacing:.07em; color:var(--sr-muted); margin-bottom:calc(1.4mm * var(--scale));
  }
  .pill{
    display:inline-block; border-radius:999px; padding:calc(1.1mm * var(--scale)) calc(2.6mm * var(--scale));
    font-size:calc(8.8px * var(--scale)); font-weight:500; line-height:1.35;
    background:var(--sr-paper); border:1px solid var(--sr-line-2); color:var(--sr-green);
  }
  .pill.accent{ background:rgba(110,146,120,.15); border-color:rgba(110,146,120,.38); color:#2E4B3F; }

  .lang{ font-size:calc(9.6px * var(--scale)); line-height:1.55; color:var(--sr-forest); }

  .edu + .edu{ margin-top:calc(1.3mm * var(--scale)); }
  .edu-t{ font-size:calc(9.6px * var(--scale)); font-weight:600; line-height:1.35; }
  .edu-s{ font-size:calc(9px * var(--scale)); color:#4C5F59; line-height:1.4; }

  /* ---------- Bilan de competences ---------- */
  .bil-head{
    display:flex; justify-content:space-between; align-items:baseline;
    gap:4mm; margin-bottom:calc(2.4mm * var(--scale));
  }
  .bil-head .label{ margin-bottom:0; white-space:nowrap; }
  /* La legende porte quatre niveaux, jauge comprise : elle doit pouvoir passer
     a la ligne, sinon le dernier sort du cadre sans laisser de trace. */
  .legend{
    display:flex; flex-wrap:wrap; justify-content:flex-end;
    gap:calc(1mm * var(--scale)) calc(2.6mm * var(--scale)); align-items:center;
  }
  .lg{
    display:flex; align-items:center; gap:calc(1.1mm * var(--scale));
    font-size:calc(7.8px * var(--scale)); font-weight:600; letter-spacing:.05em;
    text-transform:uppercase; color:var(--sr-muted); white-space:nowrap;
  }

  .dot{
    flex:0 0 auto; display:inline-block; border-radius:999px;
    width:calc(1.7mm * var(--scale)); height:calc(1.7mm * var(--scale));
  }
  .ok  .dot{ background:var(--sr-sage); }
  .wip .dot{ background:var(--sr-gold); }
  .no  .dot{ background:transparent; box-shadow:inset 0 0 0 1px rgba(32,56,50,.34); }
  .na  .dot{ background:transparent; box-shadow:inset 0 0 0 1px rgba(32,56,50,.20); }

  /* Une espece = un bloc, ouvert par un bandeau qui porte le chiffre que la
     clinique cherche : combien d'actes tenus seul. */
  .grp + .grp{ margin-top:calc(2.4mm * var(--scale)); }
  .grp-t{
    display:flex; align-items:center; gap:calc(2.2mm * var(--scale));
    margin-bottom:calc(1.3mm * var(--scale));
    border-bottom:1px solid var(--sr-line-2); padding-bottom:calc(.9mm * var(--scale));
  }
  .grp-n{
    font-family:"Fraunces", Georgia, serif;
    font-size:calc(12.5px * var(--scale)); font-weight:600; letter-spacing:-.015em;
    line-height:1.2; color:var(--sr-forest);
  }
  /* Les decomptes se lisent a cote du nom de l'espece, en texte. Chiffres en
     noir : ce sont des quantites, pas des etats — l'etat est deja porte par le
     libelle qui suit et par la couleur des pastilles en dessous. Pas de
     pastille ici non plus, elles entreraient en concurrence avec les actes. */
  .grp-c{ display:flex; align-items:baseline; gap:calc(2mm * var(--scale)); }
  .cnt{
    display:inline-flex; align-items:baseline; gap:calc(.8mm * var(--scale));
    font-size:calc(7.8px * var(--scale)); font-weight:500; letter-spacing:.02em;
    white-space:nowrap; color:var(--sr-muted);
  }
  .cnt b{
    font-size:calc(10.2px * var(--scale)); font-weight:700; letter-spacing:-.01em;
    color:var(--sr-forest);
  }
  /* en mode de secours, le bandeau rend aussi ses millimetres */
  .grp.compact + .grp.compact{ margin-top:calc(2mm * var(--scale)); }
  .grp.compact .grp-t{ border-bottom:0; padding-bottom:0; margin-bottom:calc(.9mm * var(--scale)); }
  .grp.compact .grp-n{ font-size:calc(10.4px * var(--scale)); }

  /* --- Variante « jauge » : un acte par ligne, note sur trois points --------
     Le bilan se lit comme un releve : l'acte a gauche, sa jauge a droite. Les
     jauges s'alignent en colonne, donc le niveau se lit verticalement sans
     lire un seul intitule. La famille devient un intertitre suivi d'un filet,
     au lieu d'un element mele aux actes.
     Le referentiel compte une cinquantaine d'actes : a une ligne par acte, la
     colonne principale est montee sur DEUX colonnes typographiques, chaque
     espece formant un bloc insecable. */
  .bilan{ column-count:2; column-gap:calc(5.5mm * var(--scale)); }
  /* Un bilan peu fourni ne se met pas sur deux colonnes : la seconde se
     retrouve avec une espece et deux lignes, et le vide a cote se lit comme
     une erreur de mise en page plutot que comme une fiche peu qualifiee. */
  .bilan.mono{ column-count:1; }
  .grp{ break-inside:avoid; page-break-inside:avoid; }
  .grp:first-child .grp-t{ margin-top:0; }

  .fam{ margin-top:calc(1.5mm * var(--scale)); }
  .grp .fam:first-of-type{ margin-top:calc(.9mm * var(--scale)); }
  /* intitule de famille suivi d'un filet qui file jusqu'au bord de la colonne */
  /* La famille est un bandeau, pas une ligne de texte : sur un relevé de
     cinquante actes, un intitulé qui ne se distingue que par sa couleur se
     noie. Le fond sauge pâle découpe la colonne en sections qu'on repère sans
     lire, et c'est ce qui permet d'aller droit à « chirurgie de convenance »
     ou « imagerie » quand on cherche un geste précis. */
  .fam-t{
    font-size:calc(7.6px * var(--scale)); font-weight:700; line-height:1.25;
    letter-spacing:.04em; text-transform:uppercase; color:var(--sr-forest);
    background:rgba(110,146,120,.16);
    border-radius:calc(1mm * var(--scale));
    padding:calc(.5mm * var(--scale)) calc(1.5mm * var(--scale));
    margin-bottom:calc(.8mm * var(--scale));
  }

  /* Une ligne d'acte : la jauge D'ABORD, puis le libelle. La jauge a droite
     mettait dix centimetres entre l'acte et son niveau sur une colonne pleine
     largeur ; collee au libelle, elle se lit comme une puce, et les jauges
     restent alignees verticalement comme dans la legende. */
  .li{
    display:flex; align-items:center; gap:calc(1.8mm * var(--scale));
    font-size:calc(9.2px * var(--scale)); line-height:1.35; color:var(--sr-forest);
  }
  .li + .li{ margin-top:calc(.6mm * var(--scale)); }
  .li .nom{ flex:1 1 auto; min-width:0; overflow-wrap:break-word; }
  /* Bilan sur une colonne (24 actes au plus) : la famille devient un intitule
     a gauche (30 mm) et ses actes coulent a droite, plusieurs par ligne. Dix
     actes ne justifient pas sept bandeaux pleine largeur ; une famille = une
     ligne, separee de la suivante par un filet, se parcourt d'un regard. */
  .bilan.mono .fam{
    display:grid; grid-template-columns:calc(32mm * var(--scale)) 1fr;
    column-gap:calc(3mm * var(--scale)); align-items:start;
    margin-top:0; padding:calc(1.1mm * var(--scale)) 0;
    border-bottom:1px solid var(--sr-line);
  }
  .bilan.mono .grp .fam:first-of-type{ margin-top:0; }
  .bilan.mono .grp .fam:last-of-type{ border-bottom:0; }
  .bilan.mono .fam-t{
    background:none; border-radius:0; padding:calc(.45mm * var(--scale)) 0 0;
    margin:0; color:var(--sr-muted); letter-spacing:.04em;
    font-size:calc(7.3px * var(--scale));
  }
  .bilan.mono .fam-l{
    display:flex; flex-wrap:wrap; gap:calc(.7mm * var(--scale)) calc(4.5mm * var(--scale));
  }
  .bilan.mono .li{ flex:0 0 auto; }
  .bilan.mono .li + .li{ margin-top:0; }
  .bilan.mono .li .nom{ flex:0 0 auto; }
  .li.no .nom{ color:var(--sr-muted); }
  .li.na .nom{ color:var(--sr-muted); }

  .jauge{ flex:0 0 auto; display:flex; gap:calc(.75mm * var(--scale)); }
  .jauge i{
    display:block; border-radius:999px;
    width:calc(1.6mm * var(--scale)); height:calc(1.6mm * var(--scale));
    background:rgba(32,56,50,.13);            /* cran eteint */
  }
  /* Degrade des crans allumes, du plus tenu au moins tenu. L'orange est un ton
     propre a la jauge, volontairement distinct du terracotta de la marque : le
     terracotta reste au logo et au sous-titre metier, et se lirait comme une
     alerte sur une competence. */
  .jauge.t3 i.on{ background:var(--sr-green); }
  .jauge.t2 i.on{ background:var(--sr-orange); }
  .jauge.t1 i.on{ background:var(--sr-gold); }
  .jauge.na i{ background:transparent; box-shadow:inset 0 0 0 1px rgba(32,56,50,.20); }

  /* Les non acquis restent affiches — l'honnetete sur les limites est ce qui
     rend le reste credible — mais en fin de bloc et en retrait : une ligne de
     texte, pas une pastille de plus a trier du regard. */
  /* --- Parcours : une frise, un poste par bloc, sous le bilan --------------
     Colonne de gauche (27 mm) : la duree en gras, la periode dessous en gris ;
     c'est ce que le lecteur cherche d'abord — la duree dit la stabilite — et
     en colonne, les durees se comparent d'un coup d'oeil. A droite, l'intitule
     et la structure sur une ligne pleine largeur (plus de titre casse en deux
     par une date), puis la description. */
  .exp{
    display:grid; grid-template-columns:calc(27mm * var(--scale)) 1fr;
    column-gap:calc(3.5mm * var(--scale)); align-items:start;
  }
  .exp + .exp{ margin-top:calc(2.1mm * var(--scale)); }
  .exp-q{ padding-top:calc(.2mm * var(--scale)); }
  .exp-q .duree{
    display:block; font-size:calc(9.2px * var(--scale)); font-weight:600;
    line-height:1.3; color:var(--sr-forest);
  }
  .exp-q .periode{
    display:block; font-size:calc(7.9px * var(--scale)); font-weight:500;
    line-height:1.3; color:var(--sr-muted);
  }
  .exp-t{
    display:flex; flex-wrap:wrap; align-items:baseline; gap:0 calc(2.4mm * var(--scale));
    font-size:calc(9.2px * var(--scale)); line-height:1.3; color:var(--sr-forest);
  }
  .exp-t b{ font-weight:600; }
  .exp-t .ou{ font-weight:500; color:var(--sr-green); }
  .exp-d{
    font-size:calc(8.6px * var(--scale)); line-height:1.42; color:#4C5F59;
    margin-top:calc(.5mm * var(--scale));
  }

  .nonac{
    margin-top:calc(1.4mm * var(--scale));
    font-size:calc(7.9px * var(--scale)); line-height:1.4; color:var(--sr-muted);
  }
  .nonac b{
    font-weight:600; letter-spacing:.05em; text-transform:uppercase;
    font-size:calc(7px * var(--scale)); color:var(--sr-muted);
  }

  /* mode compact : une ligne de texte par etat, utilise si les pastilles debordent */
  .cl{
    font-size:calc(9px * var(--scale)); line-height:1.5;
    display:flex; gap:calc(1.6mm * var(--scale)); align-items:flex-start;
  }
  .cl + .cl{ margin-top:calc(.7mm * var(--scale)); }
  .cl .dot{ margin-top:calc(1.5mm * var(--scale)); }
  .cl .fam-i{
    font-weight:600; letter-spacing:.06em; text-transform:uppercase;
    font-size:calc(7.1px * var(--scale)); color:var(--sr-muted);
  }
  .cl.ok  span{ color:#2E4B3F; }
  .cl.wip span{ color:#7A5620; }
  .cl.no  span{ color:var(--sr-muted); }
  .cl.na  span{ color:var(--sr-muted); }

  .empty{
    border:1px dashed var(--sr-line-2); border-radius:12px;
    padding:calc(3.4mm * var(--scale)) calc(4mm * var(--scale));
    font-size:calc(9px * var(--scale)); line-height:1.5; color:var(--sr-muted);
  }

  /* ---------- Pied ---------- */
  .foot{
    flex:0 0 auto; margin:0 14mm; padding:calc(2.6mm * var(--scale)) 0 calc(5.5mm * var(--scale));
    border-top:1px solid var(--sr-line);
    display:flex; justify-content:space-between; align-items:center; gap:6mm;
    font-size:calc(8px * var(--scale)); letter-spacing:.055em; text-transform:uppercase;
    font-weight:500; color:var(--sr-muted);
  }
  .foot .sep{ color:var(--sr-sage); }

  @media print{
    html,body{ background:#fff; padding:0; }
    .page{ box-shadow:none; margin:0; }
  }
</style>
</head>
<body>
<div class="page" id="page">

  <header class="band">
    <div class="brand">
      <svg viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg" aria-label="SaRecrute">
        <path d="M60 18a24 24 0 0 1 0 44 24 24 0 0 1 0-44z" fill="#426354"/>
        <circle cx="46" cy="40" r="24" fill="none" stroke="#6E9278" stroke-width="7"/>
        <circle cx="74" cy="40" r="24" fill="none" stroke="#C87355" stroke-width="7"/>
      </svg>
      <div class="wordmark">Sa<span class="r">R</span>ecrute</div>
    </div>
    <div class="band-label">
      Dossier de présentation candidat
      <span class="ref" id="ref"></span>
    </div>
  </header>

  <div class="body" id="fit">
    <section class="identity">
      <h1 class="name" id="name"></h1>
      <div class="subtitle" id="subtitle"></div>
      <p class="accroche" id="accroche"></p>
    </section>

    <div class="cols">
      <aside class="aside" id="aside"></aside>
      <main class="main" id="main"></main>
    </div>
  </div>

  <footer class="foot">
    <span>SaRecrute <span class="sep">·</span> Recrutement vétérinaire <span class="sep">·</span> France <span class="sep">·</span> Suisse <span class="sep">·</span> Espagne <span class="sep">·</span> Belgique</span>
    <span id="foot-ref"></span>
  </footer>
</div>

<script>
(function(){
  const esc = s => String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const C = CANDIDAT;

  /* ---------- identite ---------- */
  const nomAffiche = ANONYME
    ? C.prenom + " " + String(C.nom || "").trim().charAt(0).toUpperCase() + "."
    : C.prenom + " " + C.nom;

  document.getElementById("name").textContent     = nomAffiche;
  document.getElementById("subtitle").textContent = C.sousTitre || "";
  document.getElementById("accroche").textContent = C.accroche || "";
  document.getElementById("ref").textContent      = C.reference ? "Réf. " + C.reference : "";
  document.getElementById("foot-ref").textContent = C.reference
    ? "Réf. " + C.reference + (ANONYME ? " · Profil anonymisé" : "")
    : (ANONYME ? "Profil anonymisé" : "");
  document.title = nomAffiche + " — Dossier de présentation candidat · SaRecrute";

  /* ---------- colonne laterale ---------- */
  const A = [];
  // Intitule et valeur cote a cote quand les deux sont courts ; sinon empiles
  // (voir .kv.long). Les seuils suivent la largeur de la carte, pas le sens.
  const kv = rows => rows.filter(r => r[1])
    .map(r => `<div class="kv${(String(r[0]).length > 13 || String(r[1]).length > 18) ? " long" : ""}">` +
              `<dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd></div>`).join("");

  // Contact — jamais de localisation
  const ct = C.contact || {};
  const contactHtml = (ANONYME
    ? ["Communiquées après accord de mise en relation"]
    : [ct.email, ct.telephone]).filter(Boolean)
    .map(v => `<div class="ct">${esc(v)}</div>`).join("");
  if (contactHtml)
    A.push(`<section class="block"><div class="label">Contact</div><div class="card contact">${contactHtml}</div></section>`);

  // « Statut » et « En poste » ont ete retires du cadre le 07/09/2026 : un
  // dossier qui circule chez une clinique n'a pas a exposer la situation
  // courante du candidat, et les deux lignes se perimaient entre l'envoi et
  // la lecture. Elles ne sont plus ni dans le bloc de donnees ni ici.
  const cd = C.cadre || {};
  const cadreHtml = kv([
    ["Expérience",       cd.experience],
    ["Disponibilité",    cd.disponibilite],
    ["Contrat",          cd.contrat],
    ["Temps de travail", cd.tempsTravail],
    ["Gardes",           cd.gardes],
    ["Rémunération",     cd.remuneration],
    ["Mobilité",         cd.mobilite]
  ]);
  if (cadreHtml)
    A.push(`<section class="block"><div class="label">Cadre recherché</div><dl class="card soft">${cadreHtml}</dl></section>`);

  // Domaines : maitrises (accent) puis recherches
  const maitrises = [].concat(C.pratiques || [], C.specialites || []);
  const dom = [];
  if (maitrises.length)
    dom.push(`<div class="sublabel">Maîtrisés</div><div class="pills">` +
      maitrises.map(p => `<span class="pill accent">${esc(p)}</span>`).join("") + `</div>`);
  if ((C.recherche || []).length)
    dom.push(`<div class="sublabel">Recherchés</div><div class="pills">` +
      C.recherche.map(p => `<span class="pill">${esc(p)}</span>`).join("") + `</div>`);
  if (dom.length)
    A.push(`<section class="block"><div class="label">Domaines</div>${dom.join("")}</section>`);

  const f = C.formation || {};
  const edu = [];
  if (f.ecole || f.anneeSortie)
    edu.push(`<div class="edu"><div class="edu-t">Docteur vétérinaire</div>` +
      `<div class="edu-s">${esc([f.ecole, f.anneeSortie].filter(Boolean).join(" · "))}</div></div>`);
  // Une qualification binaire ("Oui") devient une pastille : deux lignes de
  // colonne economisees a chaque fois, et un badge se lit mieux qu'un couple
  // intitule/valeur qui repete « Oui ». Un intitule detaille garde son bloc.
  const badges = [];
  [["Internat", f.internat], ["DESV", f.desv], ["Diplôme complémentaire", f.diplomeSup],
   ["Habilitation sanitaire", f.habilitation]]
    .filter(r => r[1])
    .forEach(r => {
      if (/^oui$/i.test(String(r[1]).trim())) badges.push(r[0]);
      else edu.push(`<div class="edu"><div class="edu-t">${esc(r[0])}</div><div class="edu-s">${esc(r[1])}</div></div>`);
    });
  if (edu.length || badges.length)
    A.push(`<section class="block"><div class="label">Formation et diplômes</div>` +
      (edu.length ? `<div>${edu.join("")}</div>` : "") +
      (badges.length ? `<div class="pills${edu.length ? " apres" : ""}">` +
        badges.map(b => `<span class="pill accent">${esc(b)}</span>`).join("") + `</div>` : "") +
      `</section>`);

  // Langues — noms seuls, aucun niveau
  if ((C.langues || []).length)
    A.push(`<section class="block"><div class="label">Langues</div>` +
      `<div class="lang">${esc(C.langues.join(" · "))}</div></section>`);

  document.getElementById("aside").innerHTML = A.join("");

  /* ---------- bilan de competences ---------- */
  // Regroupement a deux niveaux : espece (ordre d'apparition dans les donnees),
  // puis famille d'actes. Le tri par etat se fait a l'interieur d'une famille.
  //
  // L'ordre des familles ne suit ni l'ordre d'apparition ni l'alphabet : il suit
  // le referentiel Airtable (ordre des choix du champ Famille de la table Actes).
  // C'est ce qui fait qu'un chirurgien et un rural presentent leurs actes dans le
  // meme ordre — le but d'un format standard. Une famille absente de cette liste
  // passe a la fin, par ordre alphabetique ; un acte sans famille est regroupe
  // sous un sous-groupe sans intitule, plutot que perdu.
  const FAMILLES = [
    "Chirurgie de convenance", "Chirurgie tissus mous", "Chirurgie orthopédique",
    "Reproduction / obstétrique", "Imagerie", "Anesthésie / réanimation",
    "Médecine / consultation", "Dentisterie", "Laboratoire",
    "Élevage / troupeau", "Soins techniques"
  ];
  const rangFamille = f => { const i = FAMILLES.indexOf(f); return i < 0 ? FAMILLES.length : i; };

  const groupes = [];
  (C.competences || []).forEach(c => {
    const n = NIVEAUX[c.niveau];
    if (!n || !n.etat) return;                 // "Non concerné" ou niveau inconnu : ignore
    let g = groupes.find(g => g.espece === c.espece);
    if (!g) groupes.push(g = { espece: c.espece, actes: [], familles: [] });
    const acte = { acte: c.acte, etat: n.etat, rang: n.rang, crans: n.crans,
                   teinte: n.teinte, niveau: c.niveau };
    g.actes.push(acte);                        // conserve pour le decompte de l'espece
    const nom = c.famille || "";
    let f = g.familles.find(f => f.nom === nom);
    if (!f) g.familles.push(f = { nom: nom, actes: [] });
    f.actes.push(acte);
  });
  const triActes = (a,b) => a.rang - b.rang || a.acte.localeCompare(b.acte,"fr");
  groupes.forEach(g => {
    g.actes.sort(triActes);
    g.familles.sort((a,b) => rangFamille(a.nom) - rangFamille(b.nom)
                          || a.nom.localeCompare(b.nom,"fr"));
    g.familles.forEach(f => f.actes.sort(triActes));
  });

  // Trois crans, allumes de gauche a droite selon le niveau ; la teinte donne
  // le degrade (voir NIVEAUX), l'etat ne sert qu'aux decomptes.
  function jauge(crans, teinte){
    let s = `<span class="jauge ${teinte || ""}">`;
    for (let i = 0; i < 3; i++) s += `<i class="${i < crans ? "on" : ""}"></i>`;
    return s + `</span>`;
  }

  const MAIN = document.getElementById("main");
  function renderMain(mode){
    if (!groupes.length){
      MAIN.innerHTML = `<section class="block"><div class="label">Bilan de compétences</div>` +
        `<div class="empty">Aucune compétence évaluée n'est renseignée dans la fiche candidat.</div></section>`;
      return;
    }
    // La legende ne montre que les etats reellement presents : afficher
    // « non acquis » sur un dossier qui n'en compte aucun est un contresens.
    const presents = new Set();
    let total = 0;
    groupes.forEach(g => g.actes.forEach(a => { presents.add(a.etat); total++; }));
    // La legende montre la jauge elle-meme : sans elle, trois points ne se
    // lisent pas. Elle ne liste que les niveaux reellement presents au dossier.
    const nivPresents = new Set();
    groupes.forEach(g => g.actes.forEach(a => nivPresents.add(a.niveau)));
    const legende = Object.keys(NIVEAUX)
      .filter(k => nivPresents.has(k) && NIVEAUX[k].etat)
      .map(k => {
        const n = NIVEAUX[k];
        return `<span class="lg ${n.etat}">${jauge(n.crans, n.teinte)}${esc(k)}</span>`;
      }).join("");

    let html = `<section class="block">
      <div class="bil-head"><div class="label">Compétences vérifiées</div>
      <div class="legend">${legende}</div></div>` +
      `<div class="bilan${total <= 24 ? " mono" : ""}">`;

    html += groupes.map(g => {
      const n = {}; ETATS.forEach(e => n[e.cle] = 0);
      g.actes.forEach(a => n[a.etat]++);
      // Les decomptes se rangent a cote du nom de l'espece : c'est la premiere
      // chose que lit une clinique, avant meme le detail des actes.
      const compteurs = ETATS.filter(e => n[e.cle]).map(e =>
        `<span class="cnt ${e.cle}"><b>${n[e.cle]}</b>${esc(e.libelle.toLowerCase())}</span>`).join("");
      const tete = `<div class="grp-t"><span class="grp-n">${esc(g.espece)}</span>` +
                   `<span class="grp-c">${compteurs}</span></div>`;

      // Ici les non acquis restent a leur place dans leur famille : la jauge a
      // zero cran les distingue deja sans les sortir du releve, et les mettre a
      // part romprait l'alignement des jauges qui fait tout l'interet du format.
      const familles = g.familles.filter(f => f.actes.length);
      const pied = "";

      if (mode === "chips"){
        const ligne = a =>
          `<div class="li ${a.etat}">${jauge(a.crans, a.teinte)}` +
          `<span class="nom">${esc(a.acte)}</span></div>`;
        // Sans intitule de famille, la cellule de gauche reste (vide) pour
        // que les actes s'alignent sur ceux des autres familles.
        const corps = familles.map(f =>
          `<div class="fam"><div class="fam-t">${esc(f.nom)}</div>` +
          `<div class="fam-l">` + f.actes.map(ligne).join("") + `</div></div>`
        ).join("");
        return `<div class="grp">${tete}${corps}</div>`;
      }
      // Mode compact : UNE ligne par etat, sans intitule de famille. C'est le
      // mode de secours d'un dossier qui deborde deja — sa seule mission est
      // que la page ne se coupe pas. Mesures sur 136 actes / 8 especes :
      // une ligne par famille = 1515 px pour 852 disponibles ; les intitules
      // conserves en jalons = 891 px, encore trop. Les actes gardent leur
      // ordre par famille, l'intitule seul disparait.
      const corps = ETATS.map(e => {
        const l = familles.reduce((acc, f) =>
          acc.concat(f.actes.filter(a => a.etat === e.cle).map(a => a.acte)), []);
        return l.length
          ? `<div class="cl ${e.cle}"><i class="dot"></i><span>${esc(l.join(" · "))}</span></div>`
          : "";
      }).join("");
      return `<div class="grp compact">${tete}${corps}${pied}</div>`;
    }).join("");

    html += `</div></section>`;

    // Parcours, sous le bilan : le bilan dit ce qu'elle sait faire, le parcours
    // dit ou elle l'a fait et combien de temps. Absent si le bloc est vide —
    // une fiche sans experience saisie ne montre pas une section creuse.
    const xp = (C.experiences || []).filter(e => e && (e.poste || e.structure));
    if (xp.length){
      html += `<section class="block"><div class="label">Parcours</div>` +
        xp.map(e =>
          `<div class="exp"><div class="exp-q">` +
            (e.duree ? `<span class="duree">${esc(e.duree)}</span>` : "") +
            (e.periode ? `<span class="periode">${esc(e.periode)}</span>` : "") +
          `</div><div><div class="exp-t">` +
            (e.poste ? `<b>${esc(e.poste)}</b>` : "") +
            (e.structure ? `<span class="ou">${esc(e.structure)}</span>` : "") +
          `</div>` +
            (e.description ? `<div class="exp-d">${esc(e.description)}</div>` : "") +
          `</div></div>`
        ).join("") +
        `</section>`;
    }

    MAIN.innerHTML = html;
  }

  /* ---------- ajustement automatique a la page ---------- */
  const PAGE = document.getElementById("page");
  const FIT  = document.getElementById("fit");
  const overflow = () => FIT.scrollHeight > FIT.clientHeight + 1 || PAGE.scrollHeight > PAGE.clientHeight + 1;

  // Les fiches sont de densite tres inegale : l'echelle monte jusqu'a 1.11 pour
  // qu'un dossier leger occupe la page, et descend jusqu'a 0.82 pour qu'un
  // dossier dense y tienne. Le premier palier qui ne deborde pas fait foi.
  // La colonne principale est rendue tout de suite, en dehors de la routine
  // d'ajustement. C'est vital : si le rendu ne depend que de fit(), une passe
  // qui n'aboutit jamais laisse la page SANS ses competences — invisible a
  // l'ecran (ou une passe finit par passer) mais bien reel dans le PDF.
  renderMain("chips");

  // Garde-fou : une mesure prise avant que les polices soient chargees et la
  // page composee est fausse, et elle se figerait. On abandonne la passe plutot
  // que d'arreter une echelle absurde ; d'autres passes sont planifiees plus bas.
  const pret = () =>
    (!document.fonts || document.fonts.status === "loaded") &&
    PAGE.clientHeight > 0 && FIT.clientHeight > 0;

  function fit(force){
    if (!force && !pret()) return false;
    for (const mode of ["chips", "compact"]){
      renderMain(mode);
      for (let s = 1.11; s >= 0.8199; s -= 0.01){
        document.documentElement.style.setProperty("--scale", s.toFixed(2));
        if (!overflow()) return true;
      }
    }
    document.documentElement.style.setProperty("--scale", "0.82");
    return true;
  }

  // Plusieurs passes : chacune repart du haut, la derniere valide fait foi.
  // Les passes planifiees n'empruntent pas toutes requestAnimationFrame : a
  // l'impression, sous --virtual-time-budget, rAF peut ne jamais etre servi.
  const passe = () => requestAnimationFrame(() => requestAnimationFrame(() => fit(false)));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fit(false));
  window.addEventListener("load", () => fit(false));
  setTimeout(() => fit(false), 300);
  setTimeout(() => fit(false), 900);
  // Dernier recours : au-dela de ce delai, mieux vaut une echelle approximative
  // qu'une page amputee. On force l'ajustement meme si les polices se taisent.
  setTimeout(() => fit(true), 2000);
  passe();
  fit(false);
})();
</script>
</body>
</html>
