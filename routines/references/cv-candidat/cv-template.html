<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Dossier de présentation candidat — SaRecrute</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<script>
/* ==========================================================================
   BLOC DE DONNEES — la seule zone a editer d'un candidat a l'autre.
   Aucune regle CSS ne doit etre touchee.

   REGLE ABSOLUE : chaque valeur ci-dessous est la recopie d'un champ Airtable,
   verifie par les recruteuses. Le PDF joint a la fiche (champ CV) n'est JAMAIS
   une source. Le champ "Profil IA" (fldtz8Gy68I1RMXrm) n'est JAMAIS une source.
   Un champ Airtable vide reste vide : sa ligne disparait du document.
   ========================================================================== */
/*DATA-START*/
// ANONYME = true : aucun nom (le titre prend sa place), aucune coordonnee,
// aucun employeur. C'est le script qui vide prenom, nom, contact et
// structures dans le bloc (cv_candidat.py anonymiser) : le template ne fait
// que ne pas afficher ce qui reste.
const ANONYME = false;

const CANDIDAT = {
  // --- Identite -----------------------------------------------------------
  prenom:      "Prénom",                    // fld1WR6pNpe8sAya6
  nom:         "NOM",                       // fld6yzzWrqBZBtXly
  sousTitre:   "Vétérinaire · Pratique · N ans d'expérience",
                                            // fldizV1UoejwizYSq + fldKxF494zI5Kgc6n + fldSGOptEz0Api4wN
  // Dossier anonymise seulement : le gros titre a la place du nom, 3 a 8 mots
  // (« Vétérinaire canine, médecine interne et urgences »), ecrit depuis les
  // seuls champs de ce bloc. Vide = sous-titre sans les annees.
  titre:       "",

  // Accroche CV (fld2iZ18Ayjx3m1Pi), 4 lignes maximum : ecrite par la routine
  // d'enrichissement depuis les entretiens (parcours, maniere de travailler, ce
  // que le candidat cherche), recopiee telle quelle. Jamais de nom de structure,
  // de lieu ou de personne : la meme accroche sert aux deux dossiers. Vide = pas
  // d'accroche.
  accroche:    "Quatre lignes factuelles issues des notes d'entretien : parcours, niveau d'autonomie, ce que le candidat cherche. Pas de superlatif, pas d'adjectif non sourcé.",

  // --- Contact (fldmtHKu93RMqkVw6 / fldZ9229oPu876Ls2) ---------------------
  // Pas de localisation : ni ville, ni departement, ni CP.
  contact: {
    email:     "",
    telephone: ""
  },

  // --- Cadre recherche (bandeau des reperes) — valeur vide = case absente --
  // "statut" (Statut Recherche) et "enPoste" (En poste ?) ont ete retires du
  // dossier le 07/09/2026 : ne pas les remettre, meme si la fiche les renseigne.
  cadre: {
    experience:    "",   // fldSGOptEz0Api4wN Années d'expérience
    disponibilite: "",   // fldlCCJY7quJEqbyv Date de disponibilité
    contrat:       "",   // fldZaUsTcNsN7HlWe Statuts contractuels souhaités
    tempsTravail:  "",   // fldGZhonpYwDW78ze Type de temps de travail
    gardes:        "",   // fldI1xWGed3dcQIUs + fldZ3kGzgXLhj5UJv (« Oui · fréquence »)
    remuneration:  "",   // fldZZj7aCQpzQKgZx Rémunération souhaitée
    mobilite:      ""    // NE PAS RENSEIGNER (decision du 27/08/2026)
  },

  // --- Domaines -----------------------------------------------------------
  pratiques:    [],      // fldsUtHmyFAFyjFgl Pratiques maitrisées
  specialites:  [],      // flde9dmHJUqdMZIOL Spécialités maitrisées
  recherche:    [],      // fldKxF494zI5Kgc6n Pratiques requises + fldYpaOYuUBHpqlqU Spécialités requises

  // --- Formation et diplomes ----------------------------------------------
  // Une valeur exactement egale a "Oui" sort en etiquette portant son
  // intitule ; une valeur detaillee garde un bloc. Jamais "Non".
  formation: {
    ecole:        "",    // fldEUkJLo4ygiEZHZ Ecole véto
    anneeSortie:  "",    // fldp6whT8yfZdETi4 Année de sortie
    internat:     "",    // fld3eO9JuwrHyNkIJ Internat
    desv:         "",    // fldnvfN95E23ng7ep DESV?
    diplomeSup:   "",    // fldmi2DQKpPmcpXEV Diplôme supplémentaire
    habilitation: ""     // fldSIVZ8UxggjhffA Habilitation sanitaire
  },

  // --- Langues (fld48WU9SCR9DkVN6) — noms seuls, aucun niveau -------------
  langues: [],

  // --- Parcours (table Expériences, tblTYdApkiHqKeBVi) --------------------
  // { poste, structure, periode, duree, description }, du plus recent au plus
  // ancien, propose par le script (cv_candidat.py construire_experiences).
  // Une description en « a · b · c » sort en liste a tirets. Une ligne
  // « Stages et postes courts » sans structure prend la pastille creuse.
  experiences: [],

  // --- Bilan de competences (table Compétences, tblH8Zym1DNu7PN3c) ---------
  // A plat { espece, famille, acte, niveau }, niveau recopie tel quel :
  // "Autonome" | "Ponctuel" | "En apprentissage" | "Jamais fait" | "Non concerné".
  // Regroupement, tri et decomptes sont automatiques.
  competences: []
};
/*DATA-END*/

/* Niveaux Airtable -> trois etats (decomptes) et jauge a trois crans (affichage).
   Voir template-notes.md, « Le bilan de competences ». */
const NIVEAUX = {
  "Autonome":         { etat:"ok",  rang:0, crans:3, teinte:"t3" },
  "Ponctuel":         { etat:"wip", rang:1, crans:2, teinte:"t2" },
  "En apprentissage": { etat:"wip", rang:2, crans:1, teinte:"t1" },
  "Jamais fait":      { etat:"no",  rang:3, crans:0, teinte:"t0" },
  "Non évalué":       { etat:"na",  rang:4, crans:0, teinte:"na" },
  "Non concerné":     { etat:null,  rang:9, crans:0, teinte:null }
};
const ETATS = [
  { cle:"ok",  libelle:"Acquis" },
  { cle:"wip", libelle:"En cours" },
  { cle:"no",  libelle:"Non acquis" },
  { cle:"na",  libelle:"Non évalué" }
];
</script>
<style>
  :root{
    --sr-forest:#203832; --sr-green:#426354; --sr-sage:#6E9278; --sr-muted:#64736E;
    --sr-terracotta:#C87355; --sr-gold:#DCA85E; --sr-cream:#F8F4EA;
    --sr-orange:#CE8734;
    --sr-ink-2:#3B4F49;                       /* texte courant secondaire */
    --sr-wash:#EEF2EF;                        /* sauge a 12 % sur blanc : bandeau des reperes */
    --sr-line:rgba(32,56,50,.12);
    --scale:1;
  }
  @page{ size:A4; margin:0; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:#E7E1D4; }
  body{
    font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:var(--sr-forest); -webkit-font-smoothing:antialiased;
    display:flex; justify-content:center; padding:18px 0;
  }
  .page{
    width:210mm; height:297mm; background:#fff;
    position:relative; overflow:hidden;
    display:flex; flex-direction:column;
    box-shadow:0 10px 34px rgba(32,56,50,.16);
  }
  .serif{ font-family:Fraunces,Georgia,serif; }

  /* ---------- En-tete sombre ----------
     Le logo est dessine en SVG sur le fond meme du bandeau : pas d'image
     collee avec son propre fond (le rectangle visible de la reference), et il
     s'aligne sur la meme marge de 14 mm que tout le reste. */
  .hero{
    flex:0 0 auto; background:var(--sr-forest); color:var(--sr-cream);
    padding:calc(8mm * var(--scale)) 14mm calc(6.5mm * var(--scale));
  }
  .hero-top{ display:flex; justify-content:space-between; align-items:center; }
  .brand{ display:flex; align-items:center; gap:calc(2.2mm * var(--scale)); }
  .brand svg{ width:calc(8.6mm * var(--scale)); height:auto; display:block; }
  .wordmark{
    font-family:Fraunces,Georgia,serif; font-weight:600;
    font-size:calc(17px * var(--scale)); letter-spacing:-.025em; line-height:1;
  }
  .wordmark .r{ color:var(--sr-terracotta); }
  .ref{ text-align:right; line-height:1.25; }
  .k{
    display:block; font-size:calc(7.2px * var(--scale)); font-weight:600;
    letter-spacing:.16em; text-transform:uppercase; color:rgba(248,244,234,.55);
  }
  .ref b{
    display:block; margin-top:calc(.6mm * var(--scale));
    font-size:calc(10.4px * var(--scale)); font-weight:700; letter-spacing:.07em;
  }

  .hero-main{ margin-top:calc(7mm * var(--scale)); }
  /* Le contact se range a droite du nom, pas de l'accroche : l'accroche garde
     toute la largeur et tient en quatre lignes. */
  .hero-row{ display:flex; justify-content:space-between; align-items:flex-end; gap:10mm; }
  .hero-id{ flex:1 1 auto; min-width:0; }
  .eyebrow{
    font-size:calc(8.4px * var(--scale)); font-weight:600; letter-spacing:.15em;
    text-transform:uppercase; color:var(--sr-gold);
  }
  .name{
    font-family:Fraunces,Georgia,serif; font-weight:600;
    font-size:calc(29px * var(--scale)); letter-spacing:-.02em; line-height:1.05;
    margin-top:calc(2.2mm * var(--scale)); color:#fff;
  }
  /* Le titre metier du dossier anonymise est plus long qu'un nom : il passe
     sur deux lignes plutot que de courir sur toute la largeur. */
  .name.titre{ max-width:150mm; font-size:calc(26px * var(--scale)); line-height:1.12; text-wrap:balance; }
  /* Fer a gauche : la justification ouvre des rivieres sur quatre lignes. */
  .accroche{
    margin-top:calc(3.2mm * var(--scale)); max-width:176mm;
    font-size:calc(10.2px * var(--scale)); line-height:1.55; color:rgba(248,244,234,.82);
  }
  .contact{ flex:0 0 auto; text-align:right; padding-bottom:calc(.4mm * var(--scale)); }
  .contact .v{
    display:block; margin-top:calc(.9mm * var(--scale));
    font-size:calc(9.4px * var(--scale)); line-height:1.35; color:rgba(248,244,234,.92);
    white-space:nowrap;
  }

  /* Trois tiers egaux : dans la reference les segments ne suivaient aucune grille. */
  .tri{ flex:0 0 auto; display:flex; height:calc(2.2mm * var(--scale)); }
  .tri i{ flex:1 1 0; }
  .tri i:nth-child(1){ background:var(--sr-sage); }
  .tri i:nth-child(2){ background:var(--sr-terracotta); }
  .tri i:nth-child(3){ background:var(--sr-gold); }

  /* ---------- Reperes (cadre recherche) ----------
     Chaque case apres la premiere porte son filet ET une marge interieure : le
     texte ne touche plus le separateur. Une valeur courte garde sa largeur
     naturelle (elle ne passe jamais a la ligne) ; les valeurs longues se
     partagent le reste. Une fiche a deux cases ne s'etire donc pas. */
  .facts{
    flex:0 0 auto; background:var(--sr-wash);
    padding:calc(4.2mm * var(--scale)) 14mm calc(4.4mm * var(--scale));
    display:flex; align-items:stretch;
  }
  .fact{ flex:0 0 auto; min-width:calc(22mm * var(--scale)); white-space:nowrap; }
  .fact.long{ flex:1 1 0; min-width:calc(30mm * var(--scale)); max-width:88mm; white-space:normal; }
  .fact + .fact{
    border-left:1px solid rgba(110,146,120,.32);
    margin-left:calc(3.4mm * var(--scale)); padding-left:calc(3.4mm * var(--scale));
  }
  .fact .k{ color:var(--sr-sage); letter-spacing:.13em; font-size:calc(7.4px * var(--scale)); }
  .fact .v1{
    display:block; margin-top:calc(1.3mm * var(--scale));
    font-size:calc(9.4px * var(--scale)); font-weight:600; line-height:1.32; color:var(--sr-forest);
  }
  .fact .v2{
    display:block; margin-top:calc(.4mm * var(--scale));
    font-size:calc(8.7px * var(--scale)); font-weight:500; line-height:1.32; color:#4C5F59;
  }

  /* ---------- Corps a deux colonnes ---------- */
  .body{
    flex:1 1 auto; min-height:0; padding:calc(6.5mm * var(--scale)) 14mm 0;
    display:flex; flex-direction:column;
  }
  .cols{ flex:1 1 auto; min-height:0; display:flex; gap:calc(9mm * var(--scale)); }
  .main{ flex:1 1 auto; min-width:0; }
  .aside{ flex:0 0 64mm; width:64mm; }

  .block + .block{ margin-top:calc(5.6mm * var(--scale)); }
  .h{
    display:flex; align-items:baseline; gap:calc(2.4mm * var(--scale));
    border-bottom:1px solid var(--sr-terracotta);
    padding-bottom:calc(1.5mm * var(--scale)); margin-bottom:calc(3.2mm * var(--scale));
  }
  .h .t{
    font-family:Fraunces,Georgia,serif; font-weight:600;
    font-size:calc(13.4px * var(--scale)); letter-spacing:-.01em; line-height:1.15;
  }
  .h .tag{
    font-size:calc(7.2px * var(--scale)); font-weight:600; letter-spacing:.14em;
    text-transform:uppercase; color:var(--sr-sage);
  }

  /* ---------- Parcours : frise ----------
     Un seul code couleur : pastille terracotta pleine pour un poste, pastille
     creuse pour la ligne qui regroupe stages et postes courts. Dans la
     reference, les couleurs alternaient sans rien signifier. Un filet relie
     les pastilles. */
  .tl-i{ position:relative; padding-left:calc(5.6mm * var(--scale)); }
  .tl-i + .tl-i{ margin-top:calc(3.6mm * var(--scale)); }
  .tl-i::before{
    content:""; position:absolute; left:0; top:calc(.9mm * var(--scale));
    width:calc(2.1mm * var(--scale)); height:calc(2.1mm * var(--scale));
    border-radius:50%; background:var(--sr-terracotta);
  }
  .tl-i.groupe::before{ background:#fff; box-shadow:inset 0 0 0 1.5px var(--sr-sage); }
  .tl-i:not(:last-child)::after{
    content:""; position:absolute; left:calc(1.05mm * var(--scale) - .5px);
    top:calc(3.6mm * var(--scale)); bottom:calc(-3.1mm * var(--scale));
    width:1px; background:rgba(200,115,85,.28);
  }
  .tl-d{
    font-size:calc(7.8px * var(--scale)); font-weight:700; letter-spacing:.09em;
    text-transform:uppercase; color:var(--sr-terracotta); line-height:1.3;
    margin-bottom:calc(.7mm * var(--scale));
  }
  .tl-i.groupe .tl-d{ color:var(--sr-sage); }
  .tl-d .du{ color:var(--sr-muted); font-weight:600; }
  .tl-t{ font-size:calc(10.8px * var(--scale)); font-weight:600; line-height:1.3; }
  .tl-s{ font-size:calc(9.4px * var(--scale)); font-style:italic; color:var(--sr-muted); line-height:1.35; margin-top:calc(.2mm * var(--scale)); }
  .tl-x{ margin-top:calc(1mm * var(--scale)); }
  .tl-x li{
    list-style:none; position:relative; padding-left:calc(3.6mm * var(--scale));
    font-size:calc(9.3px * var(--scale)); line-height:1.45; color:var(--sr-ink-2);
  }
  .tl-x li + li{ margin-top:calc(.4mm * var(--scale)); }
  .tl-x li::before{ content:"—"; position:absolute; left:0; color:var(--sr-muted); }

  /* ---------- Formation ---------- */
  .ed + .ed{ margin-top:calc(2.6mm * var(--scale)); }
  .ed-d{
    font-size:calc(7.8px * var(--scale)); font-weight:700; letter-spacing:.09em;
    text-transform:uppercase; color:var(--sr-sage); margin-bottom:calc(.5mm * var(--scale));
  }
  .ed-t{ font-size:calc(10.2px * var(--scale)); font-weight:600; line-height:1.3; }
  .ed-s{ font-size:calc(9.3px * var(--scale)); color:var(--sr-ink-2); line-height:1.4; }
  .badges{ display:flex; flex-wrap:wrap; gap:calc(1.4mm * var(--scale)); margin-top:calc(2.6mm * var(--scale)); }

  /* ---------- Etiquettes ----------
     Coins arrondis (1,6 mm), pas de pilule : c'est le dessin de la reference. */
  /* Tailles resserrees avec le plafond a 1.20 : deux etiquettes courantes
     (« Castration CN », « Castration CT ») tiennent cote a cote dans 64 mm. */
  .chip{
    display:inline-flex; align-items:center; gap:calc(1.1mm * var(--scale));
    border-radius:calc(1.6mm * var(--scale));
    padding:calc(1.05mm * var(--scale)) calc(1.9mm * var(--scale));
    font-size:calc(8.4px * var(--scale)); font-weight:600; line-height:1.25;
    background:var(--sr-wash); color:#2E4B3F;
  }
  .chip.out{ background:#fff; box-shadow:inset 0 0 0 1px rgba(110,146,120,.45); color:var(--sr-green); }
  .chips{ display:flex; flex-wrap:wrap; gap:calc(1.4mm * var(--scale)); }

  /* ---------- Bilan de competences ----------
     La couleur de l'etiquette porte le niveau, et la jauge la repete (lisible
     sans la couleur) ; la legende sous le titre dit ce que chaque teinte veut
     dire. Dans la reference, deux teintes sans legende. Le terracotta reste
     hors des competences : il s'y lirait comme une alerte. */
  .legend{
    display:flex; flex-wrap:wrap; gap:calc(1mm * var(--scale)) calc(3mm * var(--scale));
    margin:calc(-1.2mm * var(--scale)) 0 calc(3mm * var(--scale));
  }
  .lg{
    display:inline-flex; align-items:center; gap:calc(1.1mm * var(--scale));
    font-size:calc(7.2px * var(--scale)); font-weight:600; letter-spacing:.06em;
    text-transform:uppercase; color:var(--sr-muted); white-space:nowrap;
  }
  .grp + .grp{ margin-top:calc(3.4mm * var(--scale)); }
  .grp-t{ display:flex; align-items:baseline; justify-content:space-between; gap:2mm; margin-bottom:calc(1.6mm * var(--scale)); }
  .grp-n{ font-family:Fraunces,Georgia,serif; font-weight:600; font-size:calc(11.4px * var(--scale)); line-height:1.2; }
  .grp-c{ display:flex; gap:calc(2mm * var(--scale)); }
  .cnt{ font-size:calc(7.6px * var(--scale)); font-weight:500; color:var(--sr-muted); white-space:nowrap; }
  .cnt b{ font-size:calc(9.6px * var(--scale)); font-weight:700; color:var(--sr-forest); margin-right:.6mm; }
  .fam + .fam{ margin-top:calc(2mm * var(--scale)); }
  .fam-t{
    font-size:calc(7px * var(--scale)); font-weight:700; letter-spacing:.09em;
    text-transform:uppercase; color:var(--sr-muted); margin-bottom:calc(1mm * var(--scale));
  }
  .li.t3{ background:#E3ECE5; color:#24402F; }
  .li.t2{ background:#FBEEDC; color:#73501C; }
  .li.t1{ background:#FCF5E7; color:#7A6230; }
  .li.t0, .li.na{ background:#fff; box-shadow:inset 0 0 0 1px var(--sr-line); color:var(--sr-muted); font-weight:500; }

  .jauge{ flex:0 0 auto; display:inline-flex; gap:calc(.55mm * var(--scale)); }
  .jauge i{
    display:block; border-radius:50%;
    width:calc(1.25mm * var(--scale)); height:calc(1.25mm * var(--scale));
    background:rgba(32,56,50,.16);
  }
  .jauge.t3 i.on{ background:var(--sr-green); }
  .jauge.t2 i.on{ background:var(--sr-orange); }
  .jauge.t1 i.on{ background:var(--sr-gold); }
  .jauge.na i{ background:transparent; box-shadow:inset 0 0 0 1px rgba(32,56,50,.22); }

  /* bilan dense, dans la colonne large : une famille = une ligne filetee */
  .dense .main .fam{
    display:grid; grid-template-columns:calc(30mm * var(--scale)) 1fr;
    column-gap:calc(3mm * var(--scale)); align-items:start;
    padding:calc(1.1mm * var(--scale)) 0; border-top:1px solid var(--sr-line);
  }
  .dense .main .fam + .fam{ margin-top:0; }
  .dense .main .fam-t{ margin:calc(1.2mm * var(--scale)) 0 0; }
  .dense .main .grp-t{ justify-content:flex-start; gap:calc(4mm * var(--scale)); margin-bottom:calc(.6mm * var(--scale)); }

  /* mode compact (secours d'un bilan qui deborde) : une ligne par etat */
  .grp.compact + .grp.compact{ margin-top:calc(2.4mm * var(--scale)); }
  .cl{ display:flex; gap:calc(1.6mm * var(--scale)); font-size:calc(8.6px * var(--scale)); line-height:1.45; }
  .cl + .cl{ margin-top:calc(.8mm * var(--scale)); }
  .cl .jauge{ margin-top:calc(1.2mm * var(--scale)); }
  .cl.no span, .cl.na span{ color:var(--sr-muted); }

  .sub{
    font-size:calc(7px * var(--scale)); font-weight:700; letter-spacing:.09em;
    text-transform:uppercase; color:var(--sr-muted); margin-bottom:calc(1.2mm * var(--scale));
  }
  /* Domaines : l'intitule a gauche, les etiquettes a droite, une ligne par
     intitule. Empiles, deux intitules et deux etiquettes prenaient quatre
     lignes pour dire « Canine ». */
  .dl{ display:grid; grid-template-columns:calc(19mm * var(--scale)) 1fr; column-gap:calc(2mm * var(--scale)); align-items:center; }
  .dl + .dl{ margin-top:calc(1.6mm * var(--scale)); }
  .dl .sub{ margin:0; }

  /* Langues : noms seuls (jamais de niveau), sur une ligne. Une ligne filetee
     par langue, sans niveau en face, ne servait qu'a occuper la colonne. */
  .langs{ font-size:calc(9.6px * var(--scale)); font-weight:600; line-height:1.45; }
  .langs .sep{ color:var(--sr-sage); font-weight:500; margin:0 calc(1.2mm * var(--scale)); }

  .empty{
    border:1px dashed rgba(32,56,50,.22); border-radius:calc(1.6mm * var(--scale));
    padding:calc(3mm * var(--scale)) calc(3.4mm * var(--scale));
    font-size:calc(8.8px * var(--scale)); line-height:1.5; color:var(--sr-muted);
  }

  /* ---------- Pied ---------- */
  .foot{
    flex:0 0 auto; margin:0 14mm; padding:calc(2.6mm * var(--scale)) 0 calc(5.4mm * var(--scale));
    border-top:1px solid var(--sr-line);
    display:flex; justify-content:space-between; align-items:center; gap:6mm;
    font-size:calc(7.4px * var(--scale)); letter-spacing:.08em; text-transform:uppercase;
    font-weight:500; color:var(--sr-muted);
  }
  .foot .sep{ color:var(--sr-sage); }
  .foot b{ font-weight:700; color:var(--sr-sage); }

  @media print{
    html,body{ background:#fff; padding:0; }
    .page{ box-shadow:none; margin:0; }
  }
</style>
</head>
<body>
<div class="page" id="page">

  <header class="hero">
    <div class="hero-top">
      <div class="brand">
        <!-- viewBox recadre au trait exterieur des anneaux : sans quoi le logo
             rentre de 2 mm par rapport a la marge, comme dans la reference -->
        <svg viewBox="18.5 12.5 83 55" xmlns="http://www.w3.org/2000/svg" aria-label="SaRecrute">
          <path d="M60 18a24 24 0 0 1 0 44 24 24 0 0 1 0-44z" fill="#426354"/>
          <circle cx="46" cy="40" r="24" fill="none" stroke="#6E9278" stroke-width="7"/>
          <circle cx="74" cy="40" r="24" fill="none" stroke="#C87355" stroke-width="7"/>
        </svg>
        <span class="wordmark">Sa<span class="r">R</span>ecrute</span>
      </div>
      <div class="ref"><span class="k">Dossier de présentation</span></div>
    </div>
    <div class="hero-main">
      <div class="hero-row">
        <div class="hero-id">
          <div class="eyebrow" id="eyebrow"></div>
          <h1 class="name" id="name"></h1>
        </div>
        <div class="contact" id="contact"></div>
      </div>
      <p class="accroche" id="accroche"></p>
    </div>
  </header>
  <div class="tri"><i></i><i></i><i></i></div>
  <section class="facts" id="facts"></section>

  <div class="body" id="fit">
    <div class="cols">
      <main class="main" id="main"></main>
      <aside class="aside" id="aside"></aside>
    </div>
  </div>

  <footer class="foot">
    <span>SaRecrute <span class="sep">·</span> Recrutement vétérinaire <span class="sep">·</span> France <span class="sep">·</span> Suisse <span class="sep">·</span> Espagne <span class="sep">·</span> Belgique</span>
    <span id="foot-ref"></span>
  </footer>
</div>

<script>
(function(){
  const esc = s => String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  // Espace fine insecable devant % : « +25 % » ne se casse plus en « +25 » / « % ».
  // et espace insecable entre un nombre et son unite : « 35 h », « 3 mois » ne se coupent plus.
  const typo = s => esc(s).replace(/ (%|€)/g, "\u202F$1")
    .replace(/(\d) (h|ans?|mois|semaines?|jours?)(?![\wÀ-ÿ])/g, "$1\u00A0$2");
  const C = CANDIDAT;

  /* ---------- en-tete ----------
     Anonymise : pas de nom, le titre metier prend sa place (comme la reference
     « Vétérinaire référente en médecine féline ») et le sur-titre annonce le
     profil confidentiel. Le titre du PDF (metadonnee lue par tout lecteur) ne
     porte pas non plus de nom. */
  const morceaux = String(C.sousTitre || "").split(" · ").filter(Boolean);
  const titreAnonyme = C.titre || morceaux.filter(m => !/\bans?\b.*exp/i.test(m)).join(" · ") || "Profil vétérinaire";
  const titre = ANONYME ? titreAnonyme : [C.prenom, C.nom].filter(Boolean).join(" ");
  const NAME = document.getElementById("name");
  NAME.textContent = titre;
  if (ANONYME) NAME.classList.add("titre");
  document.getElementById("eyebrow").textContent = ANONYME
    ? ["Profil confidentiel"].concat(morceaux.slice(1)).join(" · ")
    : (C.sousTitre || "");
  document.getElementById("accroche").textContent = C.accroche || "";
  document.getElementById("foot-ref").innerHTML   = "<b>sarecrute.com</b>" +
    (ANONYME ? ` <span class="sep">·</span> Profil anonymisé` : "");
  document.title = ANONYME
    ? "Profil vétérinaire anonyme · SaRecrute"
    : titre + " — Dossier de présentation candidat · SaRecrute";

  // Contact dans l'en-tete, jamais de localisation ; aucun en anonymise.
  const ct = C.contact || {};
  const lignes = ANONYME ? []
    : [ct.email, ct.telephone].filter(Boolean).map(v => `<span class="v">${esc(v)}</span>`);
  document.getElementById("contact").innerHTML = lignes.length
    ? `<span class="k">Contact</span>${lignes.join("")}` : "";

  /* ---------- reperes : le cadre recherche ----------
     « Statut » et « En poste » restent hors du dossier (07/09/2026). */
  const cd = C.cadre || {};
  const coupe = s => { const i = String(s).indexOf(" · "); return i < 0 ? [s, ""] : [s.slice(0, i), s.slice(i + 3)]; };
  const facts = [];
  if (cd.experience)    facts.push(["Expérience", cd.experience, ""]);
  if (cd.disponibilite) facts.push(["Disponibilité", cd.disponibilite, ""]);
  if (cd.contrat)       facts.push(["Contrat", cd.contrat, cd.tempsTravail || ""]);
  else if (cd.tempsTravail) facts.push(["Temps de travail", cd.tempsTravail, ""]);
  if (cd.gardes)        facts.push(["Gardes"].concat(coupe(cd.gardes)));
  if (cd.remuneration)  facts.push(["Rémunération", cd.remuneration, ""]);
  if (cd.mobilite)      facts.push(["Mobilité", cd.mobilite, ""]);
  const FACTS = document.getElementById("facts");
  if (facts.length){
    FACTS.innerHTML = facts.map(f => {
      const long = Math.max(String(f[1]).length, String(f[2]).length) > 22;
      return `<div class="fact${long ? " long" : ""}"><span class="k">${esc(f[0])}</span>` +
        `<span class="v1">${typo(f[1])}</span>` + (f[2] ? `<span class="v2">${typo(f[2])}</span>` : "") + `</div>`;
    }).join("");
  } else FACTS.remove();

  const bloc = (titre, corps, tag) =>
    `<section class="block"><div class="h"><span class="t">${esc(titre)}</span>` +
    (tag ? `<span class="tag">${esc(tag)}</span>` : "") + `</div>${corps}</section>`;

  /* ---------- colonne principale : parcours puis formation ---------- */
  const M = [];
  const fleche = s => String(s || "").replace(/\s+[-–—]\s+/g, " → ");
  const xp = (C.experiences || []).filter(e => e && (e.poste || e.structure));
  if (xp.length){
    M.push(bloc("Parcours professionnel", xp.map(e => {
      const groupe = !e.structure && /stages|postes courts/i.test(e.poste || "");
      const date = fleche(e.periode);
      const d = (date || e.duree)
        ? `<div class="tl-d">${esc(date)}${date && e.duree ? " " : ""}${e.duree ? `<span class="du">${date ? "· " : ""}${esc(e.duree)}</span>` : ""}</div>` : "";
      const items = String(e.description || "").split(" · ").map(s => s.trim()).filter(Boolean);
      return `<div class="tl-i${groupe ? " groupe" : ""}">${d}` +
        (e.poste ? `<div class="tl-t">${esc(e.poste)}</div>` : "") +
        (e.structure ? `<div class="tl-s">${esc(e.structure)}</div>` : "") +
        (items.length ? `<ul class="tl-x">${items.map(i => `<li>${typo(i)}</li>`).join("")}</ul>` : "") +
        `</div>`;
    }).join("")));
  }

  const f = C.formation || {};
  const edu = [];
  if (f.ecole || f.anneeSortie)
    edu.push(`<div class="ed">${f.anneeSortie ? `<div class="ed-d">${esc(f.anneeSortie)}</div>` : ""}` +
      `<div class="ed-t">Docteur vétérinaire</div>${f.ecole ? `<div class="ed-s">${esc(f.ecole)}</div>` : ""}</div>`);
  // « Oui » devient une etiquette portant l'intitule ; un texte detaille garde son bloc.
  const badges = [];
  [["Internat", f.internat], ["DESV", f.desv], ["Diplôme complémentaire", f.diplomeSup],
   ["Habilitation sanitaire", f.habilitation]]
    .filter(r => r[1])
    .forEach(r => {
      if (/^oui$/i.test(String(r[1]).trim())) badges.push(r[0]);
      else edu.push(`<div class="ed"><div class="ed-t">${esc(r[1])}</div><div class="ed-s">${esc(r[0])}</div></div>`);
    });
  const formation = (edu.length || badges.length)
    ? bloc("Formation", edu.join("") +
        (badges.length ? `<div class="badges">${badges.map(b => `<span class="chip">${esc(b)}</span>`).join("")}</div>` : ""))
    : "";

  const MAIN = document.getElementById("main");

  /* ---------- colonne laterale : bilan, domaines, langues ---------- */
  const FAMILLES = [
    "Chirurgie de convenance", "Chirurgie tissus mous", "Chirurgie orthopédique",
    "Reproduction / obstétrique", "Imagerie", "Anesthésie / réanimation",
    "Médecine / consultation", "Dentisterie", "Laboratoire",
    "Élevage / troupeau", "Soins techniques"
  ];
  const rangFamille = x => { const i = FAMILLES.indexOf(x); return i < 0 ? FAMILLES.length : i; };
  const groupes = [];
  (C.competences || []).forEach(c => {
    const n = NIVEAUX[c.niveau];
    if (!n || !n.etat) return;
    let g = groupes.find(g => g.espece === c.espece);
    if (!g) groupes.push(g = { espece: c.espece, actes: [], familles: [] });
    const acte = { acte: c.acte, etat: n.etat, rang: n.rang, crans: n.crans, teinte: n.teinte, niveau: c.niveau };
    g.actes.push(acte);
    const nom = c.famille || "";
    let fa = g.familles.find(x => x.nom === nom);
    if (!fa) g.familles.push(fa = { nom: nom, actes: [] });
    fa.actes.push(acte);
  });
  const triActes = (a,b) => a.rang - b.rang || a.acte.localeCompare(b.acte,"fr");
  groupes.forEach(g => {
    g.actes.sort(triActes);
    g.familles.sort((a,b) => rangFamille(a.nom) - rangFamille(b.nom) || a.nom.localeCompare(b.nom,"fr"));
    g.familles.forEach(x => x.actes.sort(triActes));
  });
  function jauge(crans, teinte){
    let s = `<span class="jauge ${teinte || ""}">`;
    for (let i = 0; i < 3; i++) s += `<i class="${i < crans ? "on" : ""}"></i>`;
    return s + `</span>`;
  }

  const ASIDE = document.getElementById("aside");
  const reste = [];
  const maitrises = [].concat(C.pratiques || [], C.specialites || []);
  const dom = [];
  if (maitrises.length)
    dom.push(`<div class="dl"><div class="sub">Maîtrisés</div><div class="chips">` +
      maitrises.map(p => `<span class="chip">${esc(p)}</span>`).join("") + `</div></div>`);
  if ((C.recherche || []).length)
    dom.push(`<div class="dl"><div class="sub">Recherchés</div><div class="chips">` +
      C.recherche.map(p => `<span class="chip out">${esc(p)}</span>`).join("") + `</div></div>`);
  if (dom.length) reste.push(bloc("Domaines", dom.join("")));
  if ((C.langues || []).length)
    reste.push(bloc("Langues", `<div class="langs">` +
      C.langues.map(esc).join(`<span class="sep">·</span>`) + `</div>`));

  // Au-dela de 24 actes, le bilan passe dans la colonne large (familles en
  // intitule a gauche, etiquettes a droite) et la formation dans la laterale :
  // 53 actes dans 64 mm finissaient en mode texte a cote d'une colonne vide.
  const nbActes = groupes.reduce((n, g) => n + g.actes.length, 0);
  const dense = nbActes > 24;
  if (dense) MAIN.parentNode.classList.add("dense");

  // Une espece de huit actes au plus se lit d'un regard : ses familles n'ont
  // pas d'intitule (les etiquettes restent dans l'ordre des familles). Sans
  // cette regle, sept actes repartis sur cinq familles donnaient cinq lignes
  // d'intitule pour sept etiquettes.
  const SEUIL_FAMILLES = 8;

  // place = nombre de blocs de fin de colonne laterale (Langues, puis Domaines)
  // descendus sous la formation, dans la colonne principale. L'ajustement
  // essaie chaque valeur et garde la plus equilibree (voir fit).
  function render(mode, place){
    place = place || 0;
    let html;
    if (!groupes.length){
      html = bloc("Compétences", `<div class="empty">Aucune compétence évaluée n'est renseignée dans la fiche candidat.</div>`);
    } else {
      const nivPresents = new Set();
      groupes.forEach(g => g.actes.forEach(a => nivPresents.add(a.niveau)));
      const legende = Object.keys(NIVEAUX)
        .filter(k => nivPresents.has(k) && NIVEAUX[k].etat)
        .map(k => `<span class="lg">${jauge(NIVEAUX[k].crans, NIVEAUX[k].teinte)}${esc(k)}</span>`).join("");
      const corps = groupes.map(g => {
        const n = {}; ETATS.forEach(e => n[e.cle] = 0);
        g.actes.forEach(a => n[a.etat]++);
        const compteurs = ETATS.filter(e => n[e.cle]).map(e =>
          `<span class="cnt"><b>${n[e.cle]}</b>${esc(e.libelle.toLowerCase())}</span>`).join("");
        const tete = `<div class="grp-t"><span class="grp-n">${esc(g.espece)}</span><span class="grp-c">${compteurs}</span></div>`;
        const familles = g.familles.filter(x => x.actes.length);
        if (mode === "chips"){
          const etiquette = a => `<span class="chip li ${a.teinte}">${jauge(a.crans, a.teinte)}<span>${esc(a.acte)}</span></span>`;
          if (g.actes.length <= SEUIL_FAMILLES)
            return `<div class="grp">${tete}<div class="chips">` +
              familles.map(x => x.actes.map(etiquette).join("")).join("") + `</div></div>`;
          return `<div class="grp">${tete}` + familles.map(x =>
            `<div class="fam">${x.nom ? `<div class="fam-t">${esc(x.nom)}</div>` : ""}<div class="chips">` +
            x.actes.map(etiquette).join("") + `</div></div>`).join("") + `</div>`;
        }
        // compact : une ligne de texte par niveau, sans intitule de famille
        const lignes = Object.keys(NIVEAUX).filter(k => NIVEAUX[k].etat).map(k => {
          const l = familles.reduce((acc, x) => acc.concat(x.actes.filter(a => a.niveau === k).map(a => a.acte)), []);
          return l.length ? `<div class="cl ${NIVEAUX[k].etat}">${jauge(NIVEAUX[k].crans, NIVEAUX[k].teinte)}<span>${esc(l.join(" · "))}</span></div>` : "";
        }).join("");
        return `<div class="grp compact">${tete}${lignes}</div>`;
      }).join("");
      html = bloc("Compétences", `<div class="legend">${legende}</div>${corps}`, "vérifiées");
    }
    if (dense){
      MAIN.innerHTML  = M.join("") + html;
      ASIDE.innerHTML = formation + reste.join("");
    } else {
      const reste_lat = reste.slice(0, reste.length - place), descendus = reste.slice(reste.length - place);
      MAIN.innerHTML  = M.join("") + formation + descendus.join("");
      ASIDE.innerHTML = html + reste_lat.join("");
    }
  }

  /* ---------- ajustement automatique a la page ----------
     Du plafond vers le plancher par pas de 0.01, pour chaque placement des
     blocs (equilibrage), puis bascule chips -> compact. Voir template-notes.md. */
  const PAGE = document.getElementById("page");
  const FIT  = document.getElementById("fit");
  const overflow = () => FIT.scrollHeight > FIT.clientHeight + 1 || PAGE.scrollHeight > PAGE.clientHeight + 1;
  render("chips", 0);
  const pret = () =>
    (!document.fonts || document.fonts.status === "loaded") &&
    PAGE.clientHeight > 0 && FIT.clientHeight > 0;
  // 1.20 = la taille commune (recalee le 28/10/2026 sur la v2 : Gill 1.29, Voutaz 1.25,
  // Bolognin 1.17, Lecarpentier 1.13 sans plafond). Voir template-notes.md.
  const PLAFOND = 1.20, PLANCHER = 0.82;
  const echelle = s => document.documentElement.style.setProperty("--scale", s.toFixed(2));
  // Hauteur reelle du contenu d'une colonne, par le bas du dernier enfant (les
  // colonnes sont des elements flex etires : leur propre hauteur ne dit rien).
  const hauteur = c => { const d = c.lastElementChild; return d ? d.getBoundingClientRect().bottom - c.getBoundingClientRect().top : 0; };
  function plusGrandeEchelle(){
    for (let s = PLAFOND; s >= PLANCHER - 0.0001; s -= 0.01){ echelle(s); if (!overflow()) return s; }
    return null;
  }
  // Equilibrage : pour chaque mode, on essaie de descendre 0, 1 ou 2 blocs de
  // la laterale dans la principale. On garde la plus grande echelle, puis, a
  // echelle egale, les colonnes les plus proches en hauteur. Une colonne
  // pleine a cote d'une colonne a moitie vide etait le defaut du dossier Gill.
  const essais = dense ? [0] : Array.from({ length: reste.length + 1 }, (_, i) => i);
  function fit(force){
    if (!force && !pret()) return false;
    for (const mode of ["chips", "compact"]){
      let retenu = null;
      for (const place of essais){
        render(mode, place);
        const s = plusGrandeEchelle();
        if (s === null) continue;
        const ecart = Math.abs(hauteur(ASIDE) - hauteur(MAIN));
        if (!retenu || s > retenu.s + 0.001 || (Math.abs(s - retenu.s) < 0.001 && ecart < retenu.ecart - 2))
          retenu = { place, s, ecart };
      }
      if (retenu){ render(mode, retenu.place); echelle(retenu.s); return true; }
    }
    render("compact", 0); echelle(PLANCHER);
    return true;
  }
  const passe = () => requestAnimationFrame(() => requestAnimationFrame(() => fit(false)));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fit(false));
  window.addEventListener("load", () => fit(false));
  setTimeout(() => fit(false), 300);
  setTimeout(() => fit(false), 900);
  setTimeout(() => fit(true), 2000);
  passe();
  fit(false);
})();
</script>
</body>
</html>
